# Lancer depuis la racine du dépôt :
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
name: staff-flow

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: staffflow
      POSTGRES_USER: staffflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U staffflow -d staffflow"]
      interval: 10s
      retries: 10

  api:
    build: ../server
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql://staffflow:${POSTGRES_PASSWORD}@db:5432/staffflow?sslmode=disable
      SESSION_SECRET: ${SESSION_SECRET:?}
      GOOGLE_CLIENT_IDS: ${GOOGLE_CLIENT_IDS:?}
      ALLOWED_ORIGINS: https://${DOMAIN}

  web:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
      args:
        GOOGLE_WEB_CLIENT_ID: ${GOOGLE_WEB_CLIENT_ID:?}
    restart: unless-stopped
    depends_on: [api]
    environment:
      DOMAIN: ${DOMAIN:?}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config

  backup:
    build: ./backup
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql://staffflow:${POSTGRES_PASSWORD}@db:5432/staffflow?sslmode=disable
      BACKUP_PASSPHRASE: ${BACKUP_PASSPHRASE:?}
      BACKUP_KEEP_DAYS: "30"
      TZ: Europe/Paris
    volumes:
      - ${BACKUP_DIR:-/var/backups/staff-flow}:/backups

volumes:
  db:
  caddy_data:
  caddy_config:
