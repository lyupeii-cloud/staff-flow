# Lancer depuis la racine du dépôt :
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
name: staff-flow

# Journaux des conteneurs : 5 fichiers de 10 Mo au plus par service.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_DB: staffflow
      POSTGRES_USER: staffflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U staffflow -d staffflow"]
      interval: 10s
      retries: 10

  api:
    build: ../server
    restart: unless-stopped
    logging: *logging
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql://staffflow:${POSTGRES_PASSWORD}@db:5432/staffflow?sslmode=disable
      SESSION_SECRET: ${SESSION_SECRET:?}
      GOOGLE_CLIENT_IDS: ${GOOGLE_CLIENT_IDS:?}
      ALLOWED_ORIGINS: https://${DOMAIN},https://${APP_DOMAIN:-${DOMAIN}}
      # Administrateurs de la plateforme (adresses Google, séparées par des virgules).
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      # Bot Telegram (jeton donné par @BotFather) ; vide : Telegram désactivé.
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      # Compte de service Firebase (JSON en base64) ; vide : pas de notifications sur les appareils.
      FCM_CREDENTIALS_B64: ${FCM_CREDENTIALS_B64:-}
      # Traduction des messages, sur ce serveur (service « translate » ci-dessous).
      TRANSLATE_URL: http://translate:5000
      # Sauvegardes vues en lecture seule : alerte si elles ne se font plus.
      BACKUP_WATCH_DIR: /backups
    volumes:
      - ${BACKUP_DIR:-/home/debian/backups/staff-flow}:/backups:ro

  web:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
      args:
        GOOGLE_WEB_CLIENT_ID: ${GOOGLE_WEB_CLIENT_ID:?}
    restart: unless-stopped
    logging: *logging
    depends_on: [api]
    environment:
      DOMAIN: ${DOMAIN:?}
      APP_DOMAIN: ${APP_DOMAIN:-}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config

  # Traducteur libre (LibreTranslate) : les messages ne sortent pas du serveur.
  # Pas de port publié : seule l'API y accède. Modèles gardés dans un volume.
  translate:
    image: libretranslate/libretranslate:v1.9.6
    restart: unless-stopped
    logging: *logging
    environment:
      LT_LOAD_ONLY: en,fr,uk,ru,pl,ro,de,es,pt,it
    volumes:
      - translate-models:/home/libretranslate/.local

  backup:
    build: ./backup
    restart: unless-stopped
    logging: *logging
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql://staffflow:${POSTGRES_PASSWORD}@db:5432/staffflow?sslmode=disable
      BACKUP_PASSPHRASE: ${BACKUP_PASSPHRASE:?}
      BACKUP_KEEP_DAYS: "30"
      TZ: Europe/Paris
    volumes:
      - ${BACKUP_DIR:-/home/debian/backups/staff-flow}:/backups
      # Ce qui est sauvegardé en plus de la base (lecture seule).
      - ..:/repo:ro
      - ${HOSTING_DIR:-/home/debian/hosting}:/hosting:ro

volumes:
  db:
  translate-models:
    name: staff-flow_translate-models
  caddy_data:
  caddy_config:
